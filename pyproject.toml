[project]
name = "cte"
version = "0.1.0"
description = "Conformal Tool Exposure: coverage-guaranteed tool sets for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "bm25s",
    "sentence-transformers",
    "openai>=3.26",
    "langchain>=1.0",
    "langchain-core",
    "langgraph",
    "langchain-openai",
    "matplotlib",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
